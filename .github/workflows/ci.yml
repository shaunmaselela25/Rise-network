name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (fail on high or critical)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Database (migrations, RLS tests) and integration e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies all migrations from scratch)
        run: npx supabase start
      - name: Database tests (pgTAP)
        run: npx supabase test db
      - name: Database lint
        run: npx supabase db lint --level warning --fail-on warning
      - name: Export local Supabase settings
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          . "$RUNNER_TEMP/supabase.env"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"
          # Local throwaway stack key, used only by the test process to create test accounts.
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Integration e2e (real auth + database)
        run: SUPABASE_SERVICE_ROLE_KEY="$E2E_SERVICE_ROLE_KEY" npm run test:e2e:integration
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: test-results/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
