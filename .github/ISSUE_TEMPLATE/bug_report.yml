name: Bug report
description: Report a defect in the RISE NETWORK software
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include personal information, passwords or keys.
        To report a security vulnerability, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: e.g. Samsung A14, Chrome 140
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low — cosmetic
        - Medium — workaround exists
        - High — feature unusable
        - Critical — data loss or security impact
